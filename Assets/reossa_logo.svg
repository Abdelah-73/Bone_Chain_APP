<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f15;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d5dbdb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Emblem Circle -->
  <g filter="url(#shadow)">
    <circle cx="60" cy="70" r="52" fill="url(#emblemGrad)" />
    <circle cx="60" cy="70" r="48" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8" />
    <circle cx="60" cy="70" r="42" fill="none" stroke="url(#accentGrad)" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4" />
  </g>

  <!-- Bone Icon (stylized, minimal) -->
  <g transform="translate(28, 72)" opacity="0.35">
    <rect x="4" y="4" width="30" height="5" rx="2.5" fill="white" />
    <circle cx="4" cy="4" r="4.5" fill="white" />
    <circle cx="4" cy="9" r="4.5" fill="white" />
    <circle cx="34" cy="4" r="4.5" fill="white" />
    <circle cx="34" cy="9" r="4.5" fill="white" />
  </g>

  <!-- Leaf Icon (overlaid, combining with bone) -->
  <g transform="translate(38, 42)">
    <path d="M 22 28 Q 4 18 8 4 Q 12 -4 22 2 Q 30 8 26 22 Q 24 30 22 28 Z" fill="url(#leafGrad)" />
    <path d="M 22 28 Q 12 20 15 8" fill="none" stroke="#1e8449" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Recycled infinity hint -->
  <g transform="translate(35, 82)" opacity="0.5">
    <path d="M 8 0 C 8 -5 16 -5 16 0 C 16 5 8 5 8 0" fill="none" stroke="#2ecc71" stroke-width="1.3" />
    <polygon points="14,-3 16,0 13,-1" fill="#2ecc71" />
  </g>

  <!-- Brand Name -->
  <text x="130" y="58" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#1a3a2b" letter-spacing="5">
    REOSSA
  </text>

  <!-- Tagline Bar -->
  <rect x="130" y="68" width="45" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Tagline -->
  <text x="130" y="90" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#5d6d7e" letter-spacing="4">
    AGRICULTURAL SOLUTIONS
  </text>

  <!-- Subtitle -->
  <text x="130" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#aab7b8" letter-spacing="3">
    FERTILIZER &#8226; SUPPLY CHAIN &#8226; SUSTAINABILITY
  </text>

  <!-- Thin vertical accent -->
  <line x1="120" y1="40" x2="120" y2="115" stroke="#2ecc71" stroke-width="1.5" opacity="0.3" />
</svg>
